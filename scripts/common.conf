#!/usr/bin/env bash

if [[ -n "${COMMON_CONF_SOURCED:-}" ]]; then
  return 0 2>/dev/null || true
fi
COMMON_CONF_SOURCED=1

SCRIPT_DIR="$( cd -- "$( dirname -- "${BASH_SOURCE[0]}" )" &> /dev/null && pwd )"
REPO_ROOT="$( cd -- "${SCRIPT_DIR}/.." &> /dev/null && pwd )"
DEFAULT_ENV_FILE="${REPO_ROOT}/.default.env"
ENV_FILE="${REPO_ROOT}/.env"
DIST_DIR="${REPO_ROOT}/dist"
DIST_DOCKER_DIR="${DIST_DIR}/docker"
BIN_ROOT="${DIST_DIR}/bin"
DOCKER_PLATFORM="${DOCKER_PLATFORM:-linux/amd64}"
DOCKER_CMD="${DOCKER_CMD:-docker}"

export PATH="${BIN_ROOT}:${PATH}"

# shellcheck disable=SC1090 source=./.default.env
source "${DEFAULT_ENV_FILE}"

if [ -f "${ENV_FILE}" ]; then
  # shellcheck disable=SC1090 source=./.env
  source "${ENV_FILE}"
fi

function fail_if_env_init_not_finished() (
  set -o nounset -o errexit -o pipefail

  if ! [[ -f "${ENV_FILE}" ]]; then
    echo "[ERROR] Environment file not initialized. Please run 'scripts/init.sh' to initialize the environment file."
    exit 1
  fi
)