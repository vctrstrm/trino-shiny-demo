services:

  ####
  #### BUILD SERVICES
  #### -- pseudo services used to build the images

  x-build-trino-image:
    image: &trino-image "${TRINO_IMAGE:-vast-trino:${TRINO_VERSION:-475}}"
    platform: linux/amd64
    container_name: x-build-trino-image
    build:
      context: ./trino
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        - TRINO_VERSION=${TRINO_VERSION:-475}
        - VAST_TRINO_PLUGIN_ZIP_URL=${VAST_TRINO_PLUGIN_ZIP_URL:-https://github.com/vast-data/vast-db-connectors/releases/download/trino-vast-5.4.0-475-e330d19e3523/trino-vast-5.4.0-475-e330d19e3523.zip}
    network_mode: bridge
    healthcheck:
      disable: true
    command: ["true"]

  x-build-spark-image:
    image: &spark-image "${SPARK_IMAGE:-vast-spark:${SPARK_VERSION:-3.5.7}}"
    platform: linux/amd64
    container_name: x-build-spark-image
    build:
      context: ./spark
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        - JAVA_VERSION=${JAVA_VERSION:-21}
        - NESSIE_VERSION=${NESSIE_VERSION:-0.105.7}
        - SPARK_VERSION=${SPARK_VERSION:-3.5.7}
        - UV_VERSION=0.9.15
        - AWS_CLI_VERSION=2.32.9
        - PYTHON_VERSION=${PYTHON_VERSION:-3.11}
        - VAST_SPARK_PLUGIN_ZIP_URL=${VAST_SPARK_PLUGIN_ZIP_URL:-https://github.com/vast-data/vast-db-connectors/releases/download/spark3-vast-3.5.1-e330d19e3523/spark3-vast-3.5.1-e330d19e3523.zip}
    network_mode: bridge
    healthcheck:
      disable: true
    command: ["true"]

  ####
  #### RUN SERVICES
  #### -- actual services that run the stack

  # Local PostgresDB for experiments
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.1}
    container_name: postgres
    restart: unless-stopped
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    ports:
      - "${DOCKER_HOST_APP_BIND_ADDR}:${POSTGRES_DOCKER_EXTERNAL_PORT}:${POSTGRES_DOCKER_INTERNAL_PORT}"
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
        read_only: false
    networks:
      - iceberg-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nessie metastore (alt to hive-metastore); Using embedded database (RocksDB).
  nessie:
    image: ghcr.io/projectnessie/nessie:${NESSIE_VERSION:-0.105.7}
    container_name: nessie
    user: root
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    environment:
      - NESSIE_VERSION_STORE_TYPE=ROCKSDB
      - NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH=/var/nessie/rocksdb
    networks:
      - iceberg-net
    volumes:
      - type: volume
        source: nessie-data
        target: /var/nessie/rocksdb
        read_only: false
    ports:
      - "${DOCKER_HOST_APP_BIND_ADDR}:19120:19120"

  # Trino Coordinator
  trino:
    image: *trino-image
    platform: linux/amd64
    container_name: trino
    user: "0:0"
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    ports:
      - "${DOCKER_HOST_APP_BIND_ADDR}:8081:8080"
    volumes:
      - ./trino/config:/etc/trino
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      postgres:
        condition: service_healthy
      nessie:
        condition: service_healthy
      x-build-trino-image:
        condition: service_completed_successfully
      init-s3local-buckets:
        condition: service_completed_successfully
    networks:
      - iceberg-net

  # Apache Spark with Iceberg support for branching
  spark:
    image: *spark-image
    platform: linux/amd64
    container_name: spark-iceberg
    user: "0:0"
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=0.0.0.0
    ports:
      - "${DOCKER_HOST_APP_BIND_ADDR}:8082:8080"  # Spark UI (different from Trino)
      - "${DOCKER_HOST_APP_BIND_ADDR}:7077:7077"  # Spark Master
    volumes:
      - ./scripts:/scripts
      - ./jars:/opt/spark/local-jars
    networks:
      - iceberg-net
    depends_on:
      postgres:
        condition: service_healthy
      nessie:
        condition: service_healthy
      x-build-spark-image:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - |
        echo 'Starting Spark Master...'
        /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0 --port 7077 --webui-port 8080 &
        echo 'Spark Master started, keeping container alive...'
        while true; do sleep 30; done

  s3local:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    container_name: s3local
    ports:
      - "${DOCKER_HOST_APP_BIND_ADDR}:9000:9000"
      - "${DOCKER_HOST_APP_BIND_ADDR}:9001:9001"
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    environment:
      - RUSTFS_VOLUMES=/data/s3local  
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_EXTERNAL_ADDRESS=:9000  # Same as internal since no port mapping
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${LOCAL_S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${LOCAL_S3_SECRET_ACCESS_KEY}
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - s3local-data:/data
    networks:
      - iceberg-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  init-s3local-buckets:
    depends_on:
      s3local:
        condition: service_healthy
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: init-s3local-buckets
    environment:
      - AWS_ACCESS_KEY_ID=${LOCAL_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${LOCAL_S3_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - iceberg-net
    entrypoint:
      - "/bin/bash"
      - "-o"
      - "pipefail"
      - "-o"
      - "errexit"
      - "-o"
      - "nounset"
      - "-c"
    healthcheck:
      disable: true
    command:
      - |-
        echo "[START] Creating S3Local buckets: ${LOCAL_ICEBERG_S3_BUCKET_NAME}, ${LOCAL_MISC_S3_BUCKET_NAME}"
        mc alias set s3local ${LOCAL_S3_DOCKER_INTERNAL_ENDPOINT} ${LOCAL_S3_ACCESS_KEY} ${LOCAL_S3_SECRET_ACCESS_KEY}
        /usr/bin/mc mb s3local/${LOCAL_ICEBERG_S3_BUCKET_NAME};
        /usr/bin/mc mb s3local/${LOCAL_MISC_S3_BUCKET_NAME};
        echo "[DONE] S3Local buckets created: ${LOCAL_ICEBERG_S3_BUCKET_NAME}, ${LOCAL_MISC_S3_BUCKET_NAME}"

  # Shiny for Python Frontend
  shiny-app:
    build:
      context: ./shiny-app
      dockerfile: Dockerfile
    image: trino-shiny-app:latest
    container_name: shiny-app
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    ports:
      - "${DOCKER_HOST_APP_BIND_ADDR}:8000:8000"
    depends_on:
      - trino
    networks:
      - iceberg-net
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./shiny-app/app.py:/app/app.py
      - ./shiny-app/shared:/app/shared

  # Deployment container for Posit Connect
  deploy-shiny:
    build:
      context: ./shiny-app
      dockerfile: Dockerfile.deploy
    image: trino-shiny-app-deploy:latest
    container_name: deploy-shiny
    networks:
      - iceberg-net
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - RSCONNECT_HOME=/root/.rsconnect-python
    volumes:
      - ./shiny-app:/deploy
      - "${HOME}/Library/Application Support/rsconnect-python:/root/.rsconnect-python:ro"
    # The actual deploy command will be passed by make

volumes:
  nessie-data:
  s3local-data:
  postgres-data:

networks:
  iceberg-net:
    driver: bridge
