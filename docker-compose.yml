services:

  ####
  #### BUILD SERVICES
  #### -- pseudo services used to build the images

  x-build-trino-image:
    image: &trino-image "${TRINO_IMAGE:-vast-trino:${TRINO_VERSION}}"
    platform: linux/amd64
    build:
      context: ./trino
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        - TRINO_VERSION=${TRINO_VERSION:-475}
        - VAST_TRINO_PLUGIN_ZIP_URL=${VAST_TRINO_PLUGIN_ZIP_URL:-https://github.com/vast-data/vast-db-connectors/releases/download/trino-vast-5.4.0-475-e330d19e3523/trino-vast-5.4.0-475-e330d19e3523.zip}
    network_mode: bridge
    healthcheck:
      disable: true
    command: ["true"]

  x-build-spark-image:
    image: &spark-image "${SPARK_IMAGE:-vast-spark:${SPARK_VERSION:-3.5.7}}"
    platform: linux/amd64
    build:
      context: ./spark
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        - JAVA_VERSION=${JAVA_VERSION:-21}
        - NESSIE_VERSION=${NESSIE_VERSION:-0.105.7}
        - SPARK_VERSION=${SPARK_VERSION:-3.5.7}
        - UV_VERSION=0.9.15
        - AWS_CLI_VERSION=2.32.9
        - PYTHON_VERSION=${PYTHON_VERSION:-3.11}
        - VAST_SPARK_PLUGIN_ZIP_URL=${VAST_SPARK_PLUGIN_ZIP_URL:-https://github.com/vast-data/vast-db-connectors/releases/download/spark3-vast-3.5.1-e330d19e3523/spark3-vast-3.5.1-e330d19e3523.zip}
    network_mode: bridge
    healthcheck:
      disable: true
    command: ["true"]

  ####
  #### RUN SERVICES
  #### -- actual services that run the stack

  # PostgreSQL database for Hive Metastore
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iceberg-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hive Metastore (using PostgreSQL database)
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    user: "0:0"
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    environment:
      - SERVICE_NAME=metastore
      - IS_RESUME=false
      - DB_DRIVER=postgres
    ports:
      - "9083:9083"
    volumes:
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./warehouse:/data/warehouse
      - ./hive/lib/postgresql-42.6.0.jar:/opt/hive/lib/postgresql-42.6.0.jar
    networks:
      - iceberg-net
    depends_on:
      postgres:
        condition: service_healthy

  # Nessie metastore (alt to hive-metastore); Using embedded database (RocksDB).
  nessie:
    image: ghcr.io/projectnessie/nessie:${NESSIE_VERSION:-0.105.7}
    container_name: nessie
    user: root
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    environment:
      - NESSIE_VERSION_STORE_TYPE=ROCKSDB
      - NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH=/var/nessie/rocksdb
    networks:
      - iceberg-net
    volumes:
      - type: volume
        source: nessie-data
        target: /var/nessie/rocksdb
        read_only: false
    ports:
      - "19120:19120"

  # Trino Coordinator
  trino:
    image: *trino-image
    platform: linux/amd64
    container_name: trino
    user: "0:0"
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    ports:
      - "8081:8080"
    volumes:
      - ./trino/config:/etc/trino
      - ./warehouse:/data/warehouse
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      hive-metastore:
        condition: service_started
      x-build-trino-image:
        condition: service_completed_successfully
    networks:
      - iceberg-net

  # Trino CLI (for easy access)
  trino-cli:
    image: *trino-image
    platform: linux/amd64
    container_name: trino-cli
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    entrypoint: ["/bin/bash", "-c", "sleep infinity"]
    depends_on:
      trino:
        condition: service_started
      x-build-trino-image:
        condition: service_completed_successfully
    networks:
      - iceberg-net

  # Apache Spark with Iceberg support for branching
  spark:
    image: *spark-image
    platform: linux/amd64
    container_name: spark-iceberg
    user: "0:0"
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=0.0.0.0
    ports:
      - "8082:8080"  # Spark UI (different from Trino)
      - "7077:7077"  # Spark Master
    volumes:
      - ./warehouse:/data/warehouse
      - ./scripts:/scripts
      - ./hive-site.xml:/opt/spark/conf/hive-site.xml
      - ./jars:/opt/spark/local-jars
    networks:
      - iceberg-net
    depends_on:
      hive-metastore:
        condition: service_started
      x-build-spark-image:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - |
        echo 'Starting Spark Master...'
        /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0 --port 7077 --webui-port 8080 &
        echo 'Spark Master started, keeping container alive...'
        while true; do sleep 30; done

  # Shiny for Python Frontend
  shiny-app:
    build:
      context: ./shiny-app
      dockerfile: Dockerfile
    image: trino-shiny-app:latest
    container_name: shiny-app
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      - trino
    networks:
      - iceberg-net
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./shiny-app/app.py:/app/app.py
      - ./shiny-app/shared:/app/shared

  # Deployment container for Posit Connect
  deploy-shiny:
    build:
      context: ./shiny-app
      dockerfile: Dockerfile.deploy
    image: trino-shiny-app-deploy:latest
    container_name: deploy-shiny
    networks:
      - iceberg-net
    env_file:
      - path: ./.default.env
        required: true
      - path: ./.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - RSCONNECT_HOME=/root/.rsconnect-python
    volumes:
      - ./shiny-app:/deploy
      - "${HOME}/Library/Application Support/rsconnect-python:/root/.rsconnect-python:ro"
    # The actual deploy command will be passed by make

volumes:
  postgres-data:
  nessie-data:

networks:
  iceberg-net:
    driver: bridge
