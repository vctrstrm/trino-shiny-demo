connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=${ENV:VAST_ICEBERG_NESSIE_URI}
iceberg.nessie-catalog.default-warehouse-dir=${ENV:VAST_ICEBERG_NESSIE_DEFAULT_WAREHOUSE_DIR}
iceberg.file-format=PARQUET
iceberg.target-max-file-size=1GB
fs.native-s3.enabled=true
s3.endpoint=${ENV:VAST_ICEBERG_S3_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:VAST_ACCESS_KEY}
s3.aws-secret-key=${ENV:VAST_SECRET_ACCESS_KEY}
