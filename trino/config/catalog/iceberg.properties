connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=${ENV:NESSIE_DOCKER_INTERNAL_API_URI}
iceberg.nessie-catalog.default-warehouse-dir=s3://${ENV:LOCAL_ICEBERG_S3_BUCKET_NAME}/${ENV:LOCAL_ICEBERG_NESSIE_DEFAULT_WAREHOUSE_DIR}
iceberg.file-format=PARQUET
iceberg.target-max-file-size=1GB
fs.native-s3.enabled=true
s3.endpoint=${ENV:LOCAL_S3_DOCKER_INTERNAL_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:LOCAL_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:LOCAL_S3_SECRET_ACCESS_KEY}
iceberg.compression-codec=SNAPPY