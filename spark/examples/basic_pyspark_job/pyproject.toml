[project]
name = "basic-pyspark-job"
version = "0.1.0"
description = "Basic PySpark job to test Spark cluster"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyspark[sql,pandas_on_spark]==3.5.6",
    "pandas",
    "setuptools", # for some stupid reason, spark requires this (distutils)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["./src/basic_pyspark_job"]

[project.scripts]
basic-pyspark-job = "basic_pyspark_job.app:main"

[tool.uv]
dev-dependencies = [
    "ruff",
]