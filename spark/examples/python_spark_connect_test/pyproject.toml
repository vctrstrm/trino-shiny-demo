[project]
name = "spark-connect-test"
version = "0.1.0"
description = "Tool to test Spark Connect"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyspark[sql,pandas_on_spark,connect]==3.5.6",
    "pandas",
    "setuptools", # for some stupid reason, spark requires this (distutils)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["./src/spark_connect_test"]

[project.scripts]
spark-connect-test = "spark_connect_test.app:main"

[tool.uv]
dev-dependencies = [
    "ruff",
]